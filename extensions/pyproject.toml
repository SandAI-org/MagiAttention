[project]
name = "magi_attn_extensions"
dynamic = ["version"]
description = "Extensions to provide supplementary utilities based on MagiAttention."
authors = [
    {name = "Zewei Tao", email = "zeweitao@sand.ai"},
    {name = "Yunpeng Huang", email = "yunpenghuang@sand.ai"},
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["magi_attention"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "versioningit>=2.0"]
build-backend = "setuptools.build_meta"

[tool.versioningit]
vcs = "git"
default-version = "1.1.2"

[tool.versioningit.write]
file = "magi_attn_extensions/_version.py"
encoding = "utf-8"
template = "__version__ = '{version}'"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["magi_attn_extensions*"]
exclude = ["build*", "dist*", "tests*"]
